  weights_file: outputs/plan-001/codebook_7ghz_8h1v_mainlobe/codebook_weights.npz
  metadata_file: outputs/plan-001/codebook_7ghz_8h1v_mainlobe/codebook_metadata.json
  selected_ssb_method: maximum_long_term_average_received_power_once_then_fixed
  selected_ssb_error_model: none
