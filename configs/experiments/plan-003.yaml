  combining: MRC
  estimators: [perfect_csi, ls, lmmse]
  primary_estimator: lmmse_ssb_pdp
  primary_prior: ssb_pdp
  ssb_pdp_estimation_error: none
  baseline_lmmse_window_prbs: 2
  pol_cycling_lmmse_window_prbs: 2
  beam_cycling_lmmse_window_prbs: 2
  beam_cdd_lmmse_window_prbs: 48
  beam_cdd_prior: ssb_pdp_with_known_cdd_delays
  beam_cdd_include_known_per_subcarrier_normalization: true
  covariance_storage: runtime_window_only
  diagnostic_priors:
    beam_cycling: per_beam_pdp
    beam_cdd: [per_beam_pdp, ideal_joint_covariance]
