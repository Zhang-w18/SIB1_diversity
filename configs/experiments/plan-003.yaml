    - {id: P6-SSB, label: pol_cycling_prg6, scheme: pol_cycling, covariance: ssb_pdp, window_prbs: 2, prg_size_prbs: 6}
    - {id: BC-SSB, scheme: beam_cycling, covariance: ssb_pdp, window_prbs: 2, prg_size_prbs: 2}
    - {id: BC-BEAM, scheme: beam_cycling, covariance: per_beam_pdp, window_prbs: 2, prg_size_prbs: 2}
    - {id: CDD-SSB, scheme: beam_cdd, covariance: cdd_ssb_pdp, window_prbs: 48, prg_size_prbs: 2}
    - {id: CDD-BEAM, scheme: beam_cdd, covariance: cdd_per_beam_pdp, window_prbs: 48, prg_size_prbs: 2}
    - {id: CDD-IDEAL, scheme: beam_cdd, covariance: ideal_covariance, window_prbs: 48, prg_size_prbs: 2}
  perfect_csi_curves:
    - {id: PERF-B, scheme: baseline, prg_size_prbs: 2}
    - {id: PERF-P2, label: pol_cycling_prg2, scheme: pol_cycling, prg_size_prbs: 2}
    - {id: PERF-P6, label: pol_cycling_prg6, scheme: pol_cycling, prg_size_prbs: 6}
    - {id: PERF-BC, scheme: beam_cycling, prg_size_prbs: 2}
    - {id: PERF-CDD, scheme: beam_cdd, prg_size_prbs: 2}

link_normalization:
  reference_definition: 100 m horizontal-radius UMa LOS basic path gain, no shadow fading; PL=28+22log10(d3D)+20log10(fc_GHz)
  reference_large_scale_power_gain_linear: 1.21373630034847e-9
  reference_large_scale_power_gain_db: -89.158756590132
  large_scale_drop_gain_definition: sionna_step_12_pathloss_and_shadow_fading_scalar_power_gain
  channel_scaling: G0_over_Gd
  noise_variance: G0_times_10_power_minus_gamma0_db_over_10
  per_scheme_renormalization: false
  horizontal_axis: nominal_reference_Es_over_N0_gamma0_db

monte_carlo:
  snr_strategy: fixed_phased_common_drops
  phases:
    estimated:
      snr_points_db: [-11, -10.5, -10, -9.5, -9, -8.5]
      estimated_csi: true
      perfect_csi: false
    ideal:
      snr_points_db: [-12, -11.5, -11, -10.5, -10, -9.5, -9]
      estimated_csi: false
      perfect_csi: true
  fixed_drops_per_snr: 500
  target_block_errors_diagnostic: 100
  snr_stream_grid_origin_db: -12.0
  snr_stream_grid_step_db: 0.5
  drop_index_start: 0
  progress_interval_drops: 10
  confidence_level: 0.95
  confidence_interval: wilson
  stopping_rule: exactly_500_common_drops_per_snr_no_early_stop

preflight:
  platform_acceptance_report: outputs/platform_acceptance/平台基础功能调试报告.md
  frozen_codebook_sha256_required: true
  formal_run_allowed: true
